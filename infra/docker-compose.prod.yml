# Standalone production stack — pulls prebuilt images from GHCR, no source
# checkout required. Deploy with only this file plus a filled .env:
#
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Pin a specific build instead of :latest:
#   IMAGE_TAG=sha-xxxx docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  fis-cms:
    image: ghcr.io/dqbinh12/sontra-innovation-fest-cms:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production

      # SQLite
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db

      # Strapi secrets
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      # Set to false to close the `strapi transfer` websocket on this instance.
      TRANSFER_REMOTE_ENABLED: ${TRANSFER_REMOTE_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}

      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

    volumes:
      # SQLite database — named volume so ownership (uid 1001) is inherited
      # from the image on first use. Back up with `docker run --rm -v sif_cms-data:/data ...`.
      - cms-data:/app/apps/cms/.tmp

      # Uploaded media — persists across rebuilds/restarts.
      # Mount the entire `public` folder, not just `public/uploads`,
      # so Strapi data transfer can rename it to `.backup` without mount boundary errors.
      - cms-uploads:/app/apps/cms/public

    # Bind to localhost and put a reverse proxy (nginx/caddy) in front for TLS.
    # Change to 0.0.0.0 only if the proxy runs in another host/container.
    ports:
      - '127.0.0.1:1337:1337'

  fis-web:
    image: ghcr.io/dqbinh12/sontra-innovation-fest-web:${IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      - fis-cms

    environment:
      NODE_ENV: production
      PORT: 7000

      # NEXT_PUBLIC_* are already baked into the image at build time; re-declaring
      # here is harmless and keeps runtime env self-documenting.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}

      # Server-side calls stay on the compose network.
      STRAPI_URL: http://fis-cms:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

    ports:
      - '127.0.0.1:7000:7000'

volumes:
  cms-data:
  cms-uploads:
