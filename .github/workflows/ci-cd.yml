name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  build-push:
    name: Build and push ${{ matrix.image }}
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # NEXT_PUBLIC_* are baked into the Next.js bundle at build time, so they
          # are passed as build args here rather than left to the server's env.
          # Keep in step with infra/.env on the server.
          - image: web
            dockerfile: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_SITE_URL=https://sontrainnovation.com
              NEXT_PUBLIC_STRAPI_URL=https://cms.sontrainnovation.com
          - image: cms
            dockerfile: apps/cms/Dockerfile
            build-args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-summary:
    name: Deploy instructions
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        env:
          REPO: ${{ github.repository }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:7}"
          {
            echo "### Images pushed"
            echo
            echo "- \`ghcr.io/${REPO}-web:latest\`"
            echo "- \`ghcr.io/${REPO}-cms:latest\`"
            echo
            echo "On the production server (standalone compose, no source checkout):"
            echo
            echo "\`\`\`bash"
            echo "docker compose -f docker-compose.prod.yml --env-file .env pull"
            echo "docker compose -f docker-compose.prod.yml --env-file .env up -d"
            echo "\`\`\`"
            echo
            echo "To pin this exact build instead of \`latest\`:"
            echo
            echo "\`\`\`bash"
            echo "IMAGE_TAG=sha-${SHORT_SHA} docker compose -f docker-compose.prod.yml --env-file .env up -d"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
